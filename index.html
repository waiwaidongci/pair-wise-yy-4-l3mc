<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古工作台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 14px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 24px; }
    h2 { font-size: 17px; margin: 6px 0 10px; }
    h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    button { border: 0; border-radius: 8px; padding: 9px 12px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #64777b; }
    button.ghost { background: #e1eef0; color: #1d6c78; padding: 5px 9px; font-size: 12px; }
    button:disabled { background: #aebfc2; cursor: not-allowed; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 56px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .tabs { display: flex; gap: 6px; }
    .tab { background: #e1eef0; color: #1d6c78; }
    .tab.active { background: #1d6c78; color: #fff; }
    .app { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .map { position: relative; height: calc(100vh - 138px); min-height: 540px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .list { display: grid; gap: 8px; max-height: 330px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .timeline { display: grid; gap: 8px; max-height: 330px; overflow: auto; }
    .pill { display: inline-block; padding: 2px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .muted { color: #5c7378; font-size: 13px; }
    .ok { color: #1d7a4d; } .bad { color: #b3342b; font-weight: 800; } .warn { color: #b0741a; font-weight: 700; }

    /* 脱盐监护台 */
    .console-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .console-bar select, .console-bar input[type=text], .console-bar input[type=search] { width: auto; }
    .console-bar .cfg { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #5c7378; margin-left: auto; }
    .console-bar .cfg input { width: 74px; padding: 6px; }
    .tank-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .tank-col { min-width: 0; }
    .tank-col .col-body { display: grid; gap: 10px; max-height: calc(100vh - 250px); overflow: auto; padding-right: 2px; }
    .tank-card, .batch-card { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; background: #fbfdfd; }
    .tank-card.ready { border-color: #1d7a4d; background: #f1faf4; }
    .tank-card.anomaly { border-color: #d99; background: #fdf5f4; }
    .tank-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .badge.ready { background: #dff3e7; color: #1d7a4d; }
    .badge.pending { background: #e7f0f1; color: #48656b; }
    .badge.anomaly { background: #f7dedb; color: #b3342b; }
    .badge.void { background: #ececec; color: #6a6a6a; text-decoration: line-through; }
    .art { border-top: 1px dashed #d7e4e5; margin-top: 8px; padding-top: 8px; }
    .art-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .art-actions { margin-left: auto; display: flex; gap: 4px; }
    .reasons { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: #b0741a; }
    .reasons.bad { color: #b3342b; }
    .tank-foot { margin-top: 10px; display: flex; justify-content: flex-end; }
    .batch-card { width: 100%; text-align: left; background: #fbfdfd; color: #183035; font-weight: 400; }
    .batch-card.void { background: #f6f6f6; }
    .checklist { list-style: none; margin: 0 0 8px; padding: 0; font-size: 13px; display: grid; gap: 4px; }
    .hist { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0; }
    .hist th, .hist td { border: 1px solid #d7e4e5; padding: 4px 6px; text-align: left; }
    .warning { background: #f7dedb; border: 1px solid #d99; color: #8a2b24; border-radius: 6px; padding: 8px 10px; font-size: 13px; margin: 8px 0; }
    #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #183035; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
    #toast.show { opacity: .95; }
    @media (max-width: 1100px) { .tank-grid { grid-template-columns: 1fr; } .tank-col .col-body { max-height: none; } }
    @media (max-width: 980px) { header { display: block; } .tabs { margin: 10px 0; } .app { grid-template-columns: 1fr; } .map { height: 520px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>水下考古工作台</h1><div class="muted">沉船标记登记与遗物脱盐监护</div></div>
    <nav class="tabs">
      <button id="tabMap" class="tab active">沉船标记图</button>
      <button id="tabDesal" class="tab">脱盐监护台</button>
    </nav>
    <button id="exportBtn">导出标记JSON</button>
  </header>

  <section id="mapView" class="view app">
    <section class="panel">
      <div class="map" id="map"><div class="wreck"></div></div>
    </section>
    <aside class="panel">
      <div class="toolbar">
        <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
        <select id="view"><option value="list">标记列表</option><option value="timeline">潜次时间线</option></select>
      </div>
      <form id="form">
        <h2>标记信息</h2>
        <input name="id" type="hidden">
        <label>编号</label><input name="code" required>
        <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
        <label>潜次</label><input name="dive" placeholder="例如DIVE-04" required>
        <label>深度</label><input name="depth" placeholder="例如18.4m" required>
        <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
        <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
        <label>备注</label><textarea name="note"></textarea>
        <div class="toolbar"><button>保存标记</button><button type="button" id="deleteBtn" class="secondary">删除</button></div>
      </form>
      <h2 id="listTitle">标记列表</h2>
      <div id="list" class="list"></div>
    </aside>
  </section>

  <section id="desalView" class="view app" hidden>
    <section class="panel">
      <div class="console-bar">
        <button id="newArtifactBtn">+ 登记遗物</button>
        <select id="dMaterial">
          <option value="">全部材质</option>
          <option value="ceramic">陶瓷</option>
          <option value="wood">木质</option>
          <option value="metal">金属</option>
          <option value="unknown">未知</option>
        </select>
        <input id="dSearch" type="search" placeholder="搜槽号 / 编号" style="width:150px">
        <select id="dStatus">
          <option value="">在槽全部</option>
          <option value="pending">待换水</option>
          <option value="ready">可结批</option>
          <option value="anomaly">异常</option>
        </select>
        <span class="cfg">
          电导阈值<input id="cfgThreshold" type="number" min="1" title="μS/cm">μS/cm
          最小间隔<input id="cfgMin" type="number" min="1" title="小时">h
          超期上限<input id="cfgMax" type="number" min="1" title="小时">h
        </span>
      </div>
      <div class="tank-grid">
        <div class="tank-col">
          <h3>待换水 <span class="muted" id="countPending"></span></h3>
          <div class="col-body" id="colPending"></div>
        </div>
        <div class="tank-col">
          <h3>异常 <span class="muted" id="countAnomaly"></span></h3>
          <div class="col-body" id="colAnomaly"></div>
        </div>
        <div class="tank-col">
          <h3>结批 <span class="muted" id="countClosed"></span></h3>
          <div class="col-body" id="colClosed"></div>
        </div>
      </div>
    </section>
    <aside class="panel">
      <form id="dForm"></form>
    </aside>
  </section>

  <div id="toast"></div>

  <script src="js/desalination.js"></script>
  <script src="js/batches.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
